<style>

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 17px/1.6 Charter, Georgia, serif; }
  main { max-width: 480px; padding: 28px 24px; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; }
  p { margin: 0; }
  a { color: var(--accent); }
